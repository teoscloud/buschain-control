# BusChain Control — seal non-exported helpers from session / Pulse defaults.
# Helpers are created as media.class = Audio/Sink/Internal (Pulse-invisible).
# These rules also stamp session.ignore on name prefixes as defense in depth.
#
# Install:
#   mkdir -p ~/.config/wireplumber/wireplumber.conf.d
#   cp pipewire/wireplumber/wireplumber.conf.d/51-buschain-seal-helpers.conf \
#      ~/.config/wireplumber/wireplumber.conf.d/
#   systemctl --user restart wireplumber
#
# Or: scripts/install-wireplumber-rules.sh

node.rules = [
  {
    matches = [
      { buschain.pulse.export = "false" }
    ]
    actions = {
      update-props = {
        session.ignore = true
        priority.session = -1000
      }
    }
  }
  {
    matches = [
      { node.name = "buschain_hold" }
      { node.name = "~buschain_post_.*" }
      { node.name = "~buschain_rs_.*" }
      { node.name = "~buschain_vinf_.*" }
      { node.name = "~shadow_post_.*" }
      { node.name = "~shadow_rs_.*" }
    ]
    actions = {
      update-props = {
        session.ignore = true
        priority.session = -1000
      }
    }
  }
]
