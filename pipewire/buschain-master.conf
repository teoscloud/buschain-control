# Example PipeWire filter-chain stub for BusChain Control master bus.
# Not auto-loaded — for development / reference only.
#
# Idea: apps/tracks mix into this node; output follows the default sink.
# Wire for real once the graph controller lands.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "BusChain Control Master"
      media.name       = "BusChain Control Master"
      filter.graph = {
        nodes = [
          {
            type  = builtin
            name  = mix
            label = mixer
            control = { "Gain 1" = 1.0 "Gain 2" = 1.0 }
          }
        ]
        links = []
        inputs  = [ "mix:In 1" "mix:In 2" ]
        outputs = [ "mix:Out 1" "mix:Out 2" ]
      }
      capture.props = {
        node.name   = "buschain_master_input"
        media.class = "Audio/Sink"
        audio.channels = 2
      }
      playback.props = {
        node.name   = "buschain_master_output"
        node.passive = true
        # Eventually: target the default hardware sink
      }
    }
  }
]
