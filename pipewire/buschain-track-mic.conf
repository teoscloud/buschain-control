# Example: mic track with BusChain Denoiser + BusChain Gate (LADSPA).
# Point LADSPA_PATH at plugin build dirs before loading.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "BusChain Mic Track"
      media.name       = "BusChain Mic Track"
      filter.graph = {
        nodes = [
          {
            type  = ladspa
            name  = denoise
            plugin = buschain_denoiser
            label = buschain_denoiser
            control = { "Threshold (dB)" = -71.5 }
          }
          {
            type  = ladspa
            name  = gate
            plugin = buschain_gate
            label = buschain_gate
            control = {
              "Threshold (dB)" = -78.0
              "Hysteresis (dB)" = 3.0
              "Attack (ms)" = 2.0
              "Hold (ms)" = 80.0
              "Release (ms)" = 120.0
              "Range (dB)" = 100.0
            }
          }
        ]
        links = [
          { output = "denoise:Output L" input = "gate:Input L" }
          { output = "denoise:Output R" input = "gate:Input R" }
        ]
        inputs  = [ "denoise:Input L" "denoise:Input R" ]
        outputs = [ "gate:Output L" "gate:Output R" ]
      }
      capture.props = {
        node.name = "buschain_mic_in"
        media.class = "Audio/Sink"
      }
      playback.props = {
        node.name = "buschain_mic_out"
        media.class = "Audio/Source"
      }
    }
  }
]
