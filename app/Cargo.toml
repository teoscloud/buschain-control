[package]
name = "buschain-control"
version = "0.1.0"
edition = "2021"
description = "BusChain Control — system mixer + PipeWire control surface"
license = "MIT"

[features]
default = []
# Optional discardable VST3 adapter (Carla VST3-only). Core never requires this.
vst3-carla = []

[lib]
name = "buschain_control"
path = "src/lib.rs"

[[bin]]
name = "buschain-control"
path = "src/main.rs"

[dependencies]
buschain-engine = { path = "../engine" }
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "wayland", "x11"] }
egui = "0.31"
egui-phosphor = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
libpulse-binding = "2.28"
image = { version = "0.25", default-features = false, features = ["png"] }
ksni = "0.2"
