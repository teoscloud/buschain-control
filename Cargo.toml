[workspace]
resolver = "2"
members = ["app", "engine", "control"]
# `cargo run` → buschain-control (bootstraps plugins + buschain-ctl in debug).
default-members = ["app"]

[profile.release]
lto = true
codegen-units = 1

# crates.io lilv 0.2.4 hardcodes *const i8 for C char*. On aarch64-linux
# (and other unsigned-char ABIs) that fails to compile; use c_char instead.
[patch.crates-io]
lilv = { path = "third_party/lilv" }
