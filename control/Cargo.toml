[package]
name = "buschain-tools"
version = "0.1.0"
edition = "2021"
description = "BusChain Control daemon IPC, ctl CLI, and headless runtime"
license = "MIT"

[[bin]]
name = "buschain-daemon"
path = "src/bin/buschain-daemon.rs"

[[bin]]
name = "buschain-ctl"
path = "src/bin/buschain-ctl.rs"

[dependencies]
buschain-engine = { path = "../engine" }
buschain-control = { path = "../app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
